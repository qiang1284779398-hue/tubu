name: Build TrailKit APK
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Prepare permanent signing key
        env:
          TRAILKIT_KEYSTORE_BASE64: ${{ secrets.TRAILKIT_KEYSTORE_BASE64 }}
        run: |
          test -n "$TRAILKIT_KEYSTORE_BASE64" || { echo "Missing TRAILKIT_KEYSTORE_BASE64 repository secret"; exit 1; }
          mkdir -p app
          echo "$TRAILKIT_KEYSTORE_BASE64" | base64 --decode > app/trailkit-release.jks
          test -s app/trailkit-release.jks
      - name: Bundle native OSM zoom-18 Yubeng vector tiles
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p app/src/main/assets /tmp/osm-z18
          curl -fL --retry 4 -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/14493679742/zip" -o /tmp/osm-z18/trial.zip
          unzip -p /tmp/osm-z18/trial.zip yubeng-z18.mbtiles > app/src/main/assets/yubeng-z18.mbtiles
          test "$(stat -c%s app/src/main/assets/yubeng-z18.mbtiles)" -gt 1000000
          echo "Bundled Yubeng MBTiles: $(du -h app/src/main/assets/yubeng-z18.mbtiles | cut -f1)"
      - name: Build signed APK
        env:
          TRAILKIT_KEYSTORE_PATH: trailkit-release.jks
          TRAILKIT_STORE_PASSWORD: ${{ secrets.TRAILKIT_STORE_PASSWORD }}
        run: |
          test -n "$TRAILKIT_STORE_PASSWORD" || { echo "Missing TRAILKIT_STORE_PASSWORD repository secret"; exit 1; }
          gradle testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: TrailKit-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
