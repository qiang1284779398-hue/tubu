<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link href="maplibre-gl.css" rel="stylesheet">
<style>
html,body,#map{margin:0;width:100%;height:100%;background:#16221e;overflow:hidden}
#status{position:absolute;left:12px;bottom:16px;z-index:2;padding:8px 11px;border-radius:10px;background:rgba(18,32,27,.86);color:#e8efe8;font:12px sans-serif;max-width:82%;line-height:1.5}
.maplibregl-ctrl-group{border-radius:12px!important;overflow:hidden}
</style></head><body>
<div id="map"></div><div id="status">正在加载三维地形…</div>
<script src="maplibre-gl.js"></script><script>
(function(){
 const status=document.getElementById('status');
 const map=new maplibregl.Map({
  container:'map',center:[98.88,28.45],zoom:11.2,pitch:62,bearing:-18,maxPitch:85,
  style:{version:8,sources:{
   imagery:{type:'raster',tiles:['https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],tileSize:256,maxzoom:19,attribution:'Esri, Vantor, Earthstar Geographics, and the GIS User Community'},
   dem:{type:'raster-dem',tiles:['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],tileSize:256,maxzoom:15,encoding:'terrarium',attribution:'Terrain data: AWS Terrain Tiles / Mapzen'}
  },layers:[{id:'satellite',type:'raster',source:'imagery'}],terrain:{source:'dem',exaggeration:1.12}},
  hash:false,attributionControl:true
 });
 map.addControl(new maplibregl.NavigationControl({visualizePitch:true}),'top-right');
 map.addControl(new maplibregl.ScaleControl({unit:'metric'}),'bottom-right');
 map.on('load',function(){
  status.textContent='三维地形已加载 · 双指倾斜 / 双指旋转 / 捏合缩放';
  map.addSource('trail-route',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
  map.addLayer({id:'trail-route-casing',type:'line',source:'trail-route',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#10251e','line-width':7,'line-opacity':.9}});
  map.addLayer({id:'trail-route-line',type:'line',source:'trail-route',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#ffb547','line-width':4}});
 });
 map.on('error',function(e){if(e&&e.error)status.textContent='地图资源加载异常：'+e.error.message+'。请检查网络。';});
 window.setTrailRoute=function(feature){
  if(!map.getSource('trail-route'))return;
  map.getSource('trail-route').setData({type:'FeatureCollection',features:[feature]});
  const coords=feature.geometry.coordinates;
  if(coords&&coords.length>1){
   const bounds=coords.reduce((b,p)=>b.extend(p),new maplibregl.LngLatBounds(coords[0],coords[0]));
   map.fitBounds(bounds,{padding:48,maxZoom:14,duration:900});
  }
 };
})();
</script></body></html>
