name: Export latest screenshot
on:
  push:
    paths:
      - 'test/1795123810990_837b8c91_Screenshot_2026-11-20-05-28-50-95_adf6b73ee393c413bf8f2031da44ae56.jpg'
      - '.github/workflows/export-latest-screenshot.yml'
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: latest-navigation-screenshot
          path: test/1795123810990_837b8c91_Screenshot_2026-11-20-05-28-50-95_adf6b73ee393c413bf8f2031da44ae56.jpg
          if-no-files-found: error
          retention-days: 1