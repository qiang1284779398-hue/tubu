<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="stylesheet" href="maplibre-gl.css">
<style>
*{box-sizing:border-box}
html,body,#map{margin:0;width:100%;height:100%;overflow:hidden;background:#17221d;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
#map{position:absolute;inset:0}
#legend{position:absolute;z-index:4;top:12px;left:12px;padding:8px 11px;border-radius:9px;background:rgba(15,27,21,.86);color:#f1f5ef;font-size:12px;line-height:1.5;pointer-events:none}
#status{position:absolute;z-index:5;left:12px;right:12px;bottom:18px;padding:10px 13px;border:1px solid rgba(255,255,255,.14);border-radius:10px;background:rgba(15,27,21,.92);color:#f1f5ef;font-size:12px;line-height:1.5;pointer-events:none}
#status.error{background:rgba(85,28,22,.95)}
.maplibregl-ctrl-group{border-radius:10px!important;overflow:hidden}
.maplibregl-ctrl-attrib{font-size:9px!important}
</style>
</head>
<body>
<div id="map"></div>
<div id="legend">雨崩 · DEM 真实三维地形<br>Esri 卫星影像 · GPX 轨迹</div>
<div id="status">网页正在启动…</div>
<script src="maplibre-gl.js" onload="window.__mapLibreScriptLoaded=true;" onerror="document.getElementById('status').textContent='本地地图引擎文件加载失败：maplibre-gl.js';document.getElementById('status').className='error';try{TrailKitBridge.report('本地 maplibre-gl.js 加载失败');}catch(e){}"></script>
<script>
(function(){
 const status=document.getElementById('status');
 let fatalError='';
 let tileErrors=[];
 let sourceStats={imagery:{loaded:0,total:0},dem:{loaded:0,total:0}};
 const say=(message,error)=>{
  if(fatalError&&!error)return;
  if(error)fatalError=message;
  status.textContent=message;
  status.className=error?'error':'';
  try{if(window.TrailKitBridge)window.TrailKitBridge.report((error?'错误：':'')+message);}catch(_){}
 };
 window.addEventListener('error',e=>say('JavaScript 运行错误：'+(e.message||'未知错误'),true));
 window.addEventListener('unhandledrejection',e=>say('异步任务失败：'+(e.reason&&e.reason.message?e.reason.message:String(e.reason)),true));
 say('JavaScript 已运行，正在检查 WebGL…');
 if(!window.maplibregl){say('MapLibre 引擎没有加载。检查 APK 内置 JS 文件。',true);return;}
 try{
  // Only inspect support without creating a context; MapLibre must own the first GL context.
  const testCanvas=document.createElement('canvas');
  const supported=!!(window.WebGL2RenderingContext||window.WebGLRenderingContext);
  if(!supported){say('WebView 没有提供 WebGL API。',true);return;}
  testCanvas.width=1;testCanvas.height=1;
  say('WebGL 可用，正在创建地图…');
 }catch(e){say('WebGL 检查失败：'+(e.message||e),true);return;}
 try{
  const map=new maplibregl.Map({
   container:'map',
   center:[98.88,28.45],
   zoom:11.2,
   pitch:68,
   bearing:-22,
   maxPitch:85,
   minZoom:5,
   maxZoom:17,
   hash:false,
   attributionControl:true,
   failIfMajorPerformanceCaveat:false,
   preserveDrawingBuffer:false,
   style:{
    version:8,
    sources:{
     imagery:{
      type:'raster',
      tiles:['https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
      tileSize:256,
      maxzoom:19,
      attribution:'Esri World Imagery'
     },
     dem:{
      type:'raster-dem',
      tiles:['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],
      tileSize:256,
      maxzoom:15,
      encoding:'terrarium',
      attribution:'AWS Terrain Tiles'
     }
    },
    layers:[{id:'satellite',type:'raster',source:'imagery'}]
   }
  });
  say('地图实例创建成功，正在请求卫星影像和高程瓦片…');
  map.addControl(new maplibregl.NavigationControl({visualizePitch:true}),'top-right');
  map.addControl(new maplibregl.ScaleControl({unit:'metric'}),'bottom-right');
  map.on('load',function(){
   try{
    map.setTerrain({source:'dem',exaggeration:1.45});
    map.addLayer({id:'terrain-hillshade',type:'hillshade',source:'dem',paint:{
     'hillshade-exaggeration':0.42,
     'hillshade-shadow-color':'#26352d',
     'hillshade-highlight-color':'#fff4d6',
     'hillshade-illumination-direction':315
    }});
    map.addSource('trail-route',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
    map.addLayer({id:'trail-route-casing',type:'line',source:'trail-route',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#20251f','line-width':7,'line-opacity':0.88}});
    map.addLayer({id:'trail-route-line',type:'line',source:'trail-route',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#ffb547','line-width':4,'line-opacity':1}});
    window.setTrailRoute=function(feature){
     const src=map.getSource('trail-route');
     if(!src)return;
     src.setData({type:'FeatureCollection',features:[feature]});
     const cs=feature.geometry&&feature.geometry.coordinates;
     if(cs&&cs.length>1){
      const bounds=cs.reduce((b,p)=>b.extend(p),new maplibregl.LngLatBounds(cs[0],cs[0]));
      map.fitBounds(bounds,{padding:{top:90,bottom:100,left:48,right:48},maxZoom:14,duration:900});
     }
    };
    if(window.__trailkitPendingRoute)window.setTrailRoute(window.__trailkitPendingRoute);
    say('DEM 三维地形与地图图层已初始化，正在完成首屏渲染。');
   }catch(e){say('DEM 地形初始化失败：'+(e.message||e),true);}
  });
  map.on('error',function(e){
   const msg=e&&e.error&&e.error.message?e.error.message:'资源加载异常';
   const source=e&&e.sourceId?e.sourceId:'未知数据源';
   tileErrors.push(source+': '+msg);
   if(tileErrors.length>4)tileErrors.shift();
   say('地图数据加载错误（'+source+'）：'+msg,true);
  });
  map.on('sourcedata',function(e){
   if(!e.sourceId||!sourceStats[e.sourceId])return;
   const st=sourceStats[e.sourceId];
   if(e.isSourceLoaded)st.loaded=1;
   if(e.sourceDataType==='content')st.total++;
  });
  map.on('webglcontextlost',function(){say('WebGL 图形上下文丢失：手机网页渲染器无法继续绘制地图。',true);});
  map.on('webglcontextrestored',function(){say('WebGL 上下文已恢复，正在重绘…');});
  map.on('idle',function(){
   if(fatalError)return;
   const canvas=map.getCanvas();
   const imageryLoaded=map.isSourceLoaded('imagery');
   const demLoaded=map.isSourceLoaded('dem');
   const dims=canvas.width+'×'+canvas.height;
   if(!imageryLoaded||!demLoaded){
    say('地图引擎已启动（画布 '+dims+'），但数据未全部就绪：卫星影像 '+(imageryLoaded?'已加载':'未加载')+'；高程 DEM '+(demLoaded?'已加载':'未加载')+'。请检查网络或瓦片服务。');
   }else{
    say('影像与 DEM 数据已加载，画布 '+dims+'。如果画面仍黑，问题在手机 WebView 的 WebGL 绘制/合成环节。');
   }
  });
  window.__trailkitMap=map;
 }catch(e){say('地图初始化失败：'+(e.message||e),true);}
})();
</script>
</body>
</html>
