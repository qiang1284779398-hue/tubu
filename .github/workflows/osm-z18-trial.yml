name: OSM Native Z18 Trial

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/osm-z18-trial.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-z18-trial:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Install OSM and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool build-essential libsqlite3-dev zlib1g-dev
      - name: Build Tippecanoe
        run: |
          git clone --depth 1 https://github.com/felt/tippecanoe.git
          cd tippecanoe
          make -j2
          sudo make install
          tippecanoe --version || true
      - name: Download Guangdong and Yunnan source data
        run: |
          mkdir -p work/source work/out
          curl -fL --retry 4 --retry-delay 3 https://download.geofabrik.de/asia/china/guangdong-latest.osm.pbf -o work/source/guangdong.osm.pbf
          curl -fL --retry 4 --retry-delay 3 https://download.geofabrik.de/asia/china/yunnan-latest.osm.pbf -o work/source/yunnan.osm.pbf
          ls -lh work/source
      - name: Extract Guangzhou urban sample
        run: |
          osmium extract --strategy=complete_ways --bbox=113.22,23.05,113.38,23.18 -o work/source/guangzhou-core.osm.pbf work/source/guangdong.osm.pbf
          osmium tags-filter -o work/source/guangzhou-features.osm.pbf work/source/guangzhou-core.osm.pbf a/building nw/highway nwr/amenity nwr/shop nwr/tourism nwr/leisure nwr/public_transport nwr/office nwr/craft nwr/emergency nwr/healthcare
          osmium export -o work/source/guangzhou.geojsonseq work/source/guangzhou-features.osm.pbf
          tippecanoe -f -o work/out/guangzhou-z18.mbtiles -l osm -Z 0 -z 18 -r1 --no-feature-limit --no-tile-size-limit work/source/guangzhou.geojsonseq
      - name: Extract Yubeng hiking village sample
        run: |
          osmium extract --strategy=complete_ways --bbox=98.79,28.32,98.91,28.43 -o work/source/yubeng-area.osm.pbf work/source/yunnan.osm.pbf
          osmium tags-filter -o work/source/yubeng-features.osm.pbf work/source/yubeng-area.osm.pbf a/building nw/highway nwr/amenity nwr/shop nwr/tourism nwr/leisure nwr/public_transport nwr/office nwr/craft nwr/emergency nwr/healthcare
          osmium export -o work/source/yubeng.geojsonseq work/source/yubeng-features.osm.pbf
          tippecanoe -f -o work/out/yubeng-z18.mbtiles -l osm -Z 0 -z 18 -r1 --no-feature-limit --no-tile-size-limit work/source/yubeng.geojsonseq
      - name: Verify native zoom 18 tiles and feature metadata
        run: |
          python3 - <<'PY'
          import sqlite3, json, os
          report = {"format": "MBTiles / Mapbox Vector Tiles", "requested_maxzoom": 18, "areas": {}}
          for name in ("guangzhou", "yubeng"):
              path = f"work/out/{name}-z18.mbtiles"
              db = sqlite3.connect(path)
              metadata = dict(db.execute("SELECT name, value FROM metadata"))
              max_row = db.execute("SELECT MAX(zoom_level), COUNT(*) FROM tiles").fetchone()
              z18 = db.execute("SELECT COUNT(*) FROM tiles WHERE zoom_level=18").fetchone()[0]
              report["areas"][name] = {
                  "file": os.path.basename(path),
                  "size_bytes": os.path.getsize(path),
                  "metadata_maxzoom": metadata.get("maxzoom"),
                  "metadata_minzoom": metadata.get("minzoom"),
                  "highest_zoom_with_tiles": max_row[0],
                  "total_tile_rows": max_row[1],
                  "zoom_18_tile_rows": z18,
                  "vector_layers": json.loads(metadata.get("json", "{}")).get("vector_layers", [])
              }
              db.close()
              if int(metadata.get("maxzoom", -1)) < 18 or max_row[0] != 18 or z18 < 1:
                  raise SystemExit(f"{name}: no actual z18 tile rows found")
          with open("work/out/verification.json", "w") as f:
              json.dump(report, f, ensure_ascii=False, indent=2)
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY
      - name: Add source and license notes
        run: |
          cat > work/out/README.txt <<'EOF'
          OSM native zoom-18 vector tile experiment
          Data source: Geofabrik regional OpenStreetMap PBF extracts.
          Processing: osmium-tool + Tippecanoe; Mapbox Vector Tiles in MBTiles.
          Guangzhou sample bbox: 113.22,23.05,113.38,23.18
          Yubeng sample bbox: 98.79,28.32,98.91,28.43
          Included OSM feature groups: buildings, highways, amenities, shops, tourism, leisure, public transport, offices, crafts, emergency and healthcare.
          Zoom levels requested: 0-18. verification.json records actual tile rows at zoom 18.
          Data is © OpenStreetMap contributors, available under the Open Database License (ODbL).
          Attribution: https://www.openstreetmap.org/copyright
          Regional source downloads: https://download.geofabrik.de/asia/china.html
          This is a data-generation experiment, not a hosted tile service.
          EOF
      - name: Upload test MBTiles and verification report
        uses: actions/upload-artifact@v4
        with:
          name: osm-native-z18-trial
          path: work/out/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
