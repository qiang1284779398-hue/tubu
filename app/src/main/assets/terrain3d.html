<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>TrailKit 3D Terrain Lab</title>
<link rel="stylesheet" href="maplibre-gl.css">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body,#map{margin:0;width:100%;height:100%;overflow:hidden;background:#17231d;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
#map{position:absolute;inset:0}
#top{position:absolute;z-index:5;top:10px;left:10px;right:10px;display:flex;gap:7px;align-items:flex-start;pointer-events:none}
.panel{pointer-events:auto;background:rgba(12,24,19,.88);color:#f4f1e6;border:1px solid rgba(255,255,255,.14);border-radius:12px;box-shadow:0 3px 14px #0005;backdrop-filter:blur(8px)}
#legend{padding:8px 11px;font-size:11px;line-height:1.45;min-width:118px}
#controls{margin-left:auto;display:flex;flex-direction:column;gap:6px;max-width:56%}
button{border:1px solid #ffffff30;border-radius:10px;background:#203b2e;color:#fff;padding:9px 11px;font-size:12px;font-weight:650;min-height:36px;touch-action:manipulation}
button:active{background:#39664d}
.row{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
#readout{padding:6px 9px;font-size:11px;text-align:right;white-space:pre-line}
#bottom{position:absolute;z-index:5;left:10px;right:10px;bottom:10px;display:flex;align-items:flex-end;gap:8px;pointer-events:none}
#diagnostics{position:absolute;z-index:6;left:10px;right:10px;bottom:55px;padding:6px 9px;font-size:10px;line-height:1.35;white-space:normal;pointer-events:none;max-width:calc(100% - 20px);}
#status{padding:7px 10px;font-size:11px;line-height:1.4;max-width:72%;pointer-events:auto}
#exaggeration{padding:7px 10px;margin-left:auto;display:flex;align-items:center;gap:6px;font-size:10px;pointer-events:auto}
#exaggeration input{width:76px;accent-color:#e8bd4b}
#error{color:#ffd3c9}
#attrib{position:absolute;z-index:4;right:8px;bottom:0;color:#fff;background:#0008;padding:2px 5px;font-size:9px;pointer-events:none}
.maplibregl-ctrl-group{border-radius:10px!important;overflow:hidden}
.maplibregl-ctrl-attrib{font-size:9px!important}
.maplibregl-ctrl-bottom-right{bottom:32px}
</style>
<script>
(function(){const d=window.devicePixelRatio||1;try{Object.defineProperty(window,'devicePixelRatio',{configurable:true,get:()=>Math.min(d,2)});}catch(_){}})();
</script>
</head>
<body>
<div id="map"></div>
<div id="top">
 <div id="legend" class="panel">3D TERRAIN LAB<br><b>真实 DEM 山体</b><br>单指平移 · 双指调视角</div>
 <div id="controls">
  <div class="row">
   <button id="fit">全线复位</button><button id="north">指北</button>
  </div>
  <div class="row">
   <button id="layers">图层：卫星+晕渲</button><button id="contours">等高线：关</button>
  </div>
  <div class="row"><button id="walk">原生行走模式</button></div>
  <div id="readout" class="panel">Z -- · 方位 --° · 俯仰 --°</div>
 </div>
</div>
<div id="diagnostics" class="panel">DEM 命中 0 · 未命中 0 · 失败 0 · 回退 0 ｜ 卫星 命中 0 · 未命中 0 · 失败 0 · 回退 0</div>
<div id="bottom">
 <div id="status" class="panel">正在加载 MapLibre 地形引擎…</div>
 <label id="exaggeration" class="panel">地形夸张 <span id="exValue">1.35×</span><input id="exSlider" type="range" min="1" max="2" step="0.05" value="1.35"></label>
</div>
<div id="attrib">© Esri World Imagery · AWS Terrain Tiles</div>
<script src="maplibre-gl.js"></script>
<script>
(function(){
 'use strict';
 const status=document.getElementById('status');
 const readout=document.getElementById('readout');
 const diagnostics=document.getElementById('diagnostics');
 let transferChunks=null,transferReceived=0;
 const updateDiagnostics=()=>{
  try{
   const c=JSON.parse(TrailKitBridge.getCacheStats());
   const d=c.dem||{},i=c.imagery||{};
   diagnostics.textContent='DEM 命中 '+(d.hits||0)+' · 未命中 '+(d.misses||0)+' · 失败 '+(d.failures||0)+' · 回退 '+(d.fallbacks||0)+' ｜ 卫星 命中 '+(i.hits||0)+' · 未命中 '+(i.misses||0)+' · 失败 '+(i.failures||0)+' · 回退 '+(i.fallbacks||0);
  }catch(e){diagnostics.textContent='缓存诊断暂不可用：'+(e.message||e);}
  try{updateReadout();}catch(_){}
 };
 setInterval(updateDiagnostics,750);
 window.addEventListener('error',event=>{
  const detail=(event.message||'未知异常')+' @ '+(event.filename||'')+':'+(event.lineno||0)+':'+(event.colno||0);
  say('JavaScript 异常：'+detail,true);
 });
 window.addEventListener('unhandledrejection',event=>{
  const reason=event.reason;const detail=reason&&(reason.stack||reason.message)||String(reason||'未处理 Promise 异常');
  say('JavaScript Promise 异常：'+detail,true);
 });
 const say=(message,error)=>{status.textContent=message;status.style.borderColor=error?'#e26c5c':'rgba(255,255,255,.14)';status.style.color=error?'#ffd3c9':'#f4f1e6';try{if(window.TrailKitBridge)TrailKitBridge.onStatus(message);}catch(_){}};
 if(!window.maplibregl){say('MapLibre 本地引擎未能加载，请检查 APK 资源包。',true);return;}
 const empty={type:'FeatureCollection',features:[]};
 const WEBGL2_OK=(()=>{try{return !!window.WebGL2RenderingContext&&!!document.createElement('canvas').getContext('webgl2');}catch(_){return false;}})();
 function geoLine(){
  let canvasText='?';
  try{const c=map&&map.getCanvas();if(c)canvasText=c.clientWidth+'×'+c.clientHeight;}catch(_){}
  return 'WebGL2 '+(WEBGL2_OK?'✓':'✗')+' · 视口 '+(window.innerWidth||0)+'×'+(window.innerHeight||0)+' · 画布 '+canvasText;
 }
 let routeLineData=empty,routeRibbonData=empty,waypointData=empty,pendingData=null;
 let map=null,loaded=false,contoursVisible=false,layerMode=2,contourTimer=0,selectedWaypointId=null;
 const mapStyle={
  version:8,
  sources:{
   imagery:{type:'raster',tiles:['https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],tileSize:256,maxzoom:19,attribution:'© Esri'},
   dem:{type:'raster-dem',tiles:['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],tileSize:256,maxzoom:14,encoding:'terrarium',attribution:'AWS Terrain Tiles'},
   'terrain-contours':{type:'geojson',data:empty},
   'route-ribbon':{type:'geojson',data:empty},
   'route-line':{type:'geojson',data:empty},
   'route-points':{type:'geojson',data:empty},
   waypoints:{type:'geojson',data:empty},
   'selected-waypoint':{type:'geojson',data:empty}
  },
  layers:[
   {id:'satellite',type:'raster',source:'imagery',paint:{'raster-opacity':1}},
   {id:'terrain-hillshade',type:'hillshade',source:'dem',paint:{'hillshade-exaggeration':.38,'hillshade-shadow-color':'#25372d','hillshade-highlight-color':'#f7efd7','hillshade-illumination-direction':315}},
   {id:'terrain-contours-line',type:'line',source:'terrain-contours',layout:{'line-join':'round','line-cap':'round','visibility':'none'},paint:{'line-color':'#f1d99a','line-width':1,'line-opacity':.72}},
   {id:'route-ribbon-fill',type:'fill',source:'route-ribbon',filter:['==',['get','lod'],'overview'],paint:{'fill-color':'#ff9a3c','fill-opacity':.32}},
   {id:'route-casing',type:'line',source:'route-line',filter:['==',['get','lod'],'overview'],layout:{'line-join':'round','line-cap':'round'},paint:{'line-color':'#171d19','line-width':7,'line-opacity':.92}},
   {id:'route-main',type:'line',source:'route-line',filter:['==',['get','lod'],'overview'],layout:{'line-join':'round','line-cap':'round'},paint:{'line-color':'#ffad43','line-width':4,'line-opacity':1}},
   {id:'route-endpoints',type:'symbol',source:'route-points',layout:{'icon-image':['get','spriteId'],'icon-anchor':'bottom','icon-allow-overlap':true,'icon-ignore-placement':true,'icon-pitch-alignment':'viewport','icon-size':.72,'symbol-sort-key':0}},
   {id:'waypoint-labels',type:'symbol',source:'waypoints',layout:{'icon-image':['get','spriteId'],'icon-anchor':'bottom','icon-allow-overlap':false,'icon-ignore-placement':false,'icon-pitch-alignment':'viewport','icon-rotation-alignment':'viewport','icon-size':.62,'symbol-sort-key':['get','priority']}},
   {id:'selected-waypoint-label',type:'symbol',source:'selected-waypoint',layout:{'icon-image':['get','spriteId'],'icon-anchor':'bottom','icon-allow-overlap':true,'icon-ignore-placement':true,'icon-pitch-alignment':'viewport','icon-rotation-alignment':'viewport','icon-size':.78,'symbol-sort-key':-1}}
  ]
 };
 try{
  map=new maplibregl.Map({
   container:'map',style:mapStyle,center:[0,20],zoom:1.5,pitch:0,bearing:0,maxPitch:75,minZoom:4,maxZoom:18,
   attributionControl:true,hash:false,failIfMajorPerformanceCaveat:false,preserveDrawingBuffer:false,
   touchZoomRotate:true,touchPitch:true,doubleClickZoom:true,
   dragPan:{linearity:.18,maxSpeed:1100,deceleration:2600}
  });
 }catch(e){say('地图初始化失败：'+(e.message||e),true);return;}
 try{map.addControl(new maplibregl.ScaleControl({unit:'metric'}),'bottom-left');}catch(e){say('比例尺控件初始化异常：'+((e&&e.stack)||e),true);}
 try{map.addControl(new maplibregl.NavigationControl({showCompass:false,visualizePitch:true}),'bottom-right');}catch(e){say('导航控件初始化异常：'+((e&&e.stack)||e),true);}
 const forceSize=()=>{try{const w=window.innerWidth||0,h=window.innerHeight||0;const el=document.getElementById('map');if(el&&w>0&&h>0){el.style.width=w+'px';el.style.height=h+'px';}if(map)map.resize();}catch(_){}};
 window.addEventListener('resize',forceSize);
 setTimeout(forceSize,300);setTimeout(forceSize,1200);setTimeout(forceSize,3000);
 map.on('error',e=>{
  const message=e&&e.error&&e.error.message?e.error.message:'瓦片加载异常';
  if(/terrain|dem|tile|image|network/i.test(message))say('部分瓦片暂不可用；已缓存区域仍可显示。',false);
 });
 let readySent=false;
 const notifyReady=()=>{if(readySent)return;readySent=true;try{TrailKitBridge.onReady();say('路线数据下发已触发');}catch(e){say('原生 onReady 调用异常：'+((e&&e.stack)||e),true);}};
 map.on('style.load',()=>{
  if(loaded)return;
  const step=(name,fn)=>{try{fn();say('初始化完成：'+name);}catch(e){say('初始化步骤异常 ['+name+']：'+((e&&e.stack)||e),true);}};
  try{
   step('DEM 地形',()=>map.setTerrain({source:'dem',exaggeration:1.35}));
   step('手势控制',()=>{map.touchZoomRotate.enable();map.touchPitch.enable();map.doubleClickZoom.enable();});
   // Keep start/end labels above selected and ordinary waypoint labels.
   step('起终点图层优先级',()=>map.moveLayer('route-endpoints'));
   step('航点点击事件',()=>map.on('click','waypoint-labels',e=>{
    const feature=e.features&&e.features[0];if(!feature)return;
    selectedWaypointId=String((feature.properties||{}).id||feature.id||'');
    map.getSource('selected-waypoint').setData({type:'FeatureCollection',features:[feature]});
    map.setFilter('waypoint-labels',['!=',['get','id'],selectedWaypointId]);
    try{TrailKitBridge.onWaypointClick(JSON.stringify(feature.properties||{}));}catch(_){}
   }));
   step('航点悬停进入事件',()=>map.on('mouseenter','waypoint-labels',()=>map.getCanvas().style.cursor='pointer'));
   step('航点悬停离开事件',()=>map.on('mouseleave','waypoint-labels',()=>map.getCanvas().style.cursor=''));
   step('地图平移结束事件',()=>map.on('moveend',()=>{updateReadout();if(contoursVisible)queueContours();}));
   step('地图缩放结束事件',()=>map.on('zoomend',()=>{updateReadout();selectLod();if(contoursVisible)queueContours();}));
   step('地图旋转结束事件',()=>map.on('rotateend',updateReadout));
   step('地图俯仰结束事件',()=>map.on('pitchend',updateReadout));
   step('地图空闲与瓦片诊断事件',()=>map.on('idle',()=>{
    if(!loaded)return;
    let cacheText='缓存统计暂不可用';
    let missingDem=0,missingImagery=0;
    try{
     const c=JSON.parse(TrailKitBridge.getCacheStats());
     missingDem=c.dem.offlineMissing||0;missingImagery=c.imagery.offlineMissing||0;
     cacheText='DEM 命中 '+c.dem.hits+' / 未命中 '+c.dem.misses+' · 卫星命中 '+c.imagery.hits+' / 未命中 '+c.imagery.misses;
    }catch(_){}
    if(missingDem+missingImagery>0){
     say('瓦片缺失或网络获取失败：DEM '+missingDem+' 张、卫星影像 '+missingImagery+' 张。请联网浏览该区域完成缓存，再尝试离线使用。',true);
    }else{
     say('三维地形已就绪 · DEM z14 · '+cacheText);
    }
   }));
   loaded=true;step('相机读数更新',updateReadout);say('地图样式初始化结束，等待路线数据…');
  }catch(e){say('地图初始化主流程异常：'+((e&&e.stack)||e),true);}
  finally{
   loaded=true;
   try{updateReadout();}catch(e){say('读数更新异常：'+((e&&e.stack)||e),true);}
   notifyReady();
   if(pendingData!==null){const queued=pendingData;pendingData=null;setData(queued);}
  }
 });
 map.on('load',notifyReady);
 setTimeout(()=>{if(!readySent){say('地图样式仍未完成加载，先行下发本地路线数据');notifyReady();}},2500);
 function roundedRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
 function labelSprite(text,kind){
  const scale=2,ctxCanvas=document.createElement('canvas'),ctx=ctxCanvas.getContext('2d');
  ctx.font='bold 25px system-ui,"Noto Sans CJK SC",sans-serif';
  const width=Math.ceil(ctx.measureText(text).width+30),height=48;
  ctxCanvas.width=width*scale;ctxCanvas.height=height*scale;ctx.scale(scale,scale);
  roundedRect(ctx,1,1,width-2,height-2,10);
  ctx.fillStyle=kind==='endpoint'?'rgba(17,34,25,.96)':'rgba(12,22,18,.88)';ctx.fill();
  ctx.lineWidth=3;ctx.strokeStyle=kind==='endpoint'?'#f4c85c':'#090e0b';ctx.stroke();
  ctx.font='bold 25px system-ui,"Noto Sans CJK SC",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.lineJoin='round';ctx.lineWidth=4;ctx.strokeStyle='#090d0b';ctx.strokeText(text,width/2,height/2+1);
  ctx.fillStyle=kind==='endpoint'?'#fff0a6':'#ffd65d';ctx.fillText(text,width/2,height/2+1);
  return ctxCanvas;
 }
 function addSprite(id,text,kind){if(map.hasImage(id))map.removeImage(id);map.addImage(id,labelSprite(text,kind),{pixelRatio:2});}
 function selectLod(){
  if(!map.getLayer('route-main'))return;
  const z=map.getZoom();const lod=z<9?'overview':z<12?'mid':z<15?'near':'full';
  const filter=['==',['get','lod'],lod];
  map.setFilter('route-ribbon-fill',filter);map.setFilter('route-casing',filter);map.setFilter('route-main',filter);
 }
 function updateReadout(){
  if(!map)return;
  readout.textContent='Z '+map.getZoom().toFixed(1)+' · 方位 '+Math.round((map.getBearing()+360)%360)+'° · 俯仰 '+Math.round(map.getPitch())+'°\n'+geoLine();
 }
 function fitAll(){
  const full=routeLineData.features.find(f=>f.properties&&f.properties.lod==='full');
  const coords=full&&full.geometry&&full.geometry.coordinates;
  if(!coords||coords.length<2){say('当前项目没有可显示的有效 GPX 轨迹。',true);return false;}
  let west=Infinity,south=Infinity,east=-Infinity,north=-Infinity;
  coords.forEach(p=>{west=Math.min(west,p[0]);east=Math.max(east,p[0]);south=Math.min(south,p[1]);north=Math.max(north,p[1]);});
  if(west===east){west-=.001;east+=.001;}if(south===north){south-=.001;north+=.001;}
  map.fitBounds([[west,south],[east,north]],{padding:{top:85,bottom:85,left:45,right:45},duration:650,maxZoom:14});
  // Open/reset in the oblique 3D view from the design (pitch 58°, bearing -18°).
  // Terrain is enabled, but at pitch 0 the overview reads as a flat 2D photo map.
  let tilted=false;
  const tilt=()=>{if(tilted)return;tilted=true;try{map.easeTo({pitch:58,bearing:-18,duration:700});}catch(_){}};
  try{map.once('moveend',tilt);}catch(_){}
  setTimeout(tilt,1000);
  return true;
 }
 function updateContours(){
  if(!contoursVisible||!map||!map.getSource('terrain-contours'))return;
  const bounds=map.getBounds(),rows=38,cols=38;
  const grid=Array.from({length:rows+1},()=>Array(cols+1).fill(null));
  let min=Infinity,max=-Infinity;
  for(let y=0;y<=rows;y++)for(let x=0;x<=cols;x++){
   const lon=bounds.getWest()+(bounds.getEast()-bounds.getWest())*x/cols;
   const lat=bounds.getNorth()-(bounds.getNorth()-bounds.getSouth())*y/rows;
   const h=map.queryTerrainElevation([lon,lat]);
   if(Number.isFinite(h)){grid[y][x]=h;min=Math.min(min,h);max=Math.max(max,h);}
  }
  const features=[];if(!Number.isFinite(min)||!Number.isFinite(max)){say('DEM 尚未加载完成，等高线稍后生成。');return;}
  const first=Math.ceil(min/100)*100,last=Math.floor(max/100)*100;
  function crossing(a,b,ha,hb,level){if(ha===null||hb===null||(ha-level)*(hb-level)>0||ha===hb)return null;const t=(level-ha)/(hb-ha);return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];}
  for(let level=first;level<=last;level+=100){
   for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
    const lon0=bounds.getWest()+(bounds.getEast()-bounds.getWest())*x/cols;
    const lon1=bounds.getWest()+(bounds.getEast()-bounds.getWest())*(x+1)/cols;
    const lat0=bounds.getNorth()-(bounds.getNorth()-bounds.getSouth())*y/rows;
    const lat1=bounds.getNorth()-(bounds.getNorth()-bounds.getSouth())*(y+1)/rows;
    const corners=[[[lon0,lat0],grid[y][x]],[[lon1,lat0],grid[y][x+1]],[[lon1,lat1],grid[y+1][x+1]],[[lon0,lat1],grid[y+1][x]]];
    const hits=[];
    for(let k=0;k<4;k++){const next=(k+1)%4;const p=crossing(corners[k][0],corners[next][0],corners[k][1],corners[next][1],level);if(p)hits.push(p);}
    if(hits.length>=2)features.push({type:'Feature',properties:{elevation:level},geometry:{type:'LineString',coordinates:hits.slice(0,2)}});
   }
  }
  map.getSource('terrain-contours').setData({type:'FeatureCollection',features});
  say('等高线已生成 · 100 m 间隔 · '+features.length+' 段');
 }
 function queueContours(){clearTimeout(contourTimer);contourTimer=setTimeout(updateContours,350);}
 function setLayerMode(mode){
  layerMode=mode%3;
  const satellite=layerMode!==1,shade=layerMode!==0;
  map.setLayoutProperty('satellite','visibility',satellite?'visible':'none');
  map.setLayoutProperty('terrain-hillshade','visibility',shade?'visible':'none');
  document.getElementById('layers').textContent='图层：'+['卫星','晕渲','卫星+晕渲'][layerMode];
 }
 function setData(raw){
  const step=(name,fn)=>{try{fn();say('路线数据步骤完成：'+name);}catch(e){say('路线数据步骤异常 ['+name+']：'+((e&&e.stack)||e),true);}};
  let data;
  try{
   say('路线 setData：开始解析 JSON…');
   data=typeof raw==='string'?JSON.parse(raw):raw;
   if(!data||!data.routeLine||!data.routeRibbon||!data.waypoints)throw new Error('路线数据缺少 routeLine/routeRibbon/waypoints');
   if(!Array.isArray(data.routeLine.features)||!Array.isArray(data.routeRibbon.features)||!Array.isArray(data.waypoints.features))throw new Error('路线 GeoJSON features 格式错误');
  }catch(e){say('路线 setData 解析异常：'+((e&&e.stack)||e),true);return;}
  routeLineData=data.routeLine;routeRibbonData=data.routeRibbon;waypointData=data.waypoints;
  if(!map.getSource('route-line')||!map.getSource('route-ribbon')||!map.getSource('route-points')||!map.getSource('waypoints')||!map.getSource('selected-waypoint')){
   pendingData=raw;say('路线数据已接收，等待地图样式与本地数据源就绪…');return;
  }
  step('轨迹线 GeoJSON',()=>map.getSource('route-line').setData(routeLineData));
  step('轨迹缎带 GeoJSON',()=>map.getSource('route-ribbon').setData(routeRibbonData));
  const endpoints=[];
  if(Array.isArray(data.start)&&data.start.length>=2)endpoints.push({type:'Feature',properties:{spriteId:'endpoint-start'},geometry:{type:'Point',coordinates:data.start}});
  if(Array.isArray(data.end)&&data.end.length>=2)endpoints.push({type:'Feature',properties:{spriteId:'endpoint-end'},geometry:{type:'Point',coordinates:data.end}});
  step('起点图标注册',()=>addSprite('endpoint-start','起点','endpoint'));
  step('终点图标注册',()=>addSprite('endpoint-end','终点','endpoint'));
  step('起终点 GeoJSON',()=>map.getSource('route-points').setData({type:'FeatureCollection',features:endpoints}));
  let spriteSuccess=0,spriteFailure=0;
  waypointData.features.forEach((feature,index)=>{
   const p=feature.properties||{},name=(p.name||'途经点').slice(0,24),id=p.spriteId||('wp-'+p.id);
   try{addSprite(id,name,'waypoint');spriteSuccess++;}
   catch(e){spriteFailure++;say('航点图标异常 ['+name+']：'+((e&&e.stack)||e),true);}
  });
  say('航点图标注册：成功 '+spriteSuccess+' · 失败 '+spriteFailure);
  step('途经点 GeoJSON',()=>map.getSource('waypoints').setData(waypointData));
  step('清除选中航点状态',()=>{
   selectedWaypointId=null;
   map.getSource('selected-waypoint').setData(empty);
   map.setFilter('waypoint-labels',null);
  });
  step('路线 LOD 切换',selectLod);
  step('全线相机定位',()=>{if(!fitAll())throw new Error('当前项目没有可显示的有效 GPX 轨迹');});
  const rawCount=routeLineData.features.find(f=>f.properties&&f.properties.lod==='full')?.geometry.coordinates.length||0;
  say('路线 setData 结束 · '+rawCount+' 个轨迹点 · '+waypointData.features.length+' 个途经点 · 图标失败 '+spriteFailure+' · 已尝试全线定位');
 }
 document.getElementById('fit').addEventListener('click',fitAll);
 document.getElementById('north').addEventListener('click',()=>map.easeTo({bearing:0,duration:420}));
 document.getElementById('layers').addEventListener('click',()=>setLayerMode(layerMode+1));
 document.getElementById('contours').addEventListener('click',()=>{
  contoursVisible=!contoursVisible;
  map.setLayoutProperty('terrain-contours-line','visibility',contoursVisible?'visible':'none');
  document.getElementById('contours').textContent='等高线：'+(contoursVisible?'开':'关');
  if(contoursVisible)queueContours();
 });
 document.getElementById('walk').addEventListener('click',()=>{try{TrailKitBridge.onWalkRequested();}catch(_){}});
 document.getElementById('exSlider').addEventListener('input',event=>{
  const value=Number(event.target.value);document.getElementById('exValue').textContent=value.toFixed(2)+'×';
  map.setTerrain({source:'dem',exaggeration:value});
 });
 document.addEventListener('visibilitychange',()=>{
  if(document.hidden){if(map)map.stop();}
  else if(map){map.resize();map.triggerRepaint();}
 });
 function beginDataTransfer(count){
  if(!Number.isInteger(count)||count<1||count>2048){say('路线传输异常：分块数量无效 '+count,true);throw new Error('路线数据分块数量无效：'+count);}
  transferChunks=new Array(count);transferReceived=0;
  say('路线传输开始：共 '+count+' 块，等待原生分块…');
 }
 function appendDataChunk(index,chunk){
  if(!transferChunks||index<0||index>=transferChunks.length){say('路线传输异常：收到越界分块 '+index,true);throw new Error('路线分块索引越界：'+index);}
  if(index!==transferReceived){say('路线传输异常：分块乱序，期望 '+transferReceived+' 实际 '+index,true);throw new Error('路线分块乱序');}
  transferChunks[index]=String(chunk);transferReceived++;
  if(index===0||(index+1)%10===0||index+1===transferChunks.length)say('路线传输分块：'+transferReceived+'/'+transferChunks.length);
 }
 function finishDataTransfer(){
  say('路线传输结束信号已到达：'+transferReceived+'/'+(transferChunks?transferChunks.length:0)+' 块，正在校验…');
  let valid=!!transferChunks;
  if(valid){
   for(let i=0;i<transferChunks.length;i++){
    if(typeof transferChunks[i]!=='string'){valid=false;break;}
   }
  }
  if(!valid){
   transferChunks=null;say('路线传输异常：分块不完整，请重试。',true);return;
  }
  const raw=transferChunks.join('');const count=transferChunks.length;transferChunks=null;
  say('路线传输完成：'+count+' 块 · '+raw.length+' 字符，进入 setData…');
  setData(raw);
 }
 window.TerrainLab={
  setData,beginDataTransfer,appendDataChunk,finishDataTransfer,
  refreshTiles(kind){
   const id=kind==='DEM'?'dem':'imagery';
   const urls=id==='dem'?['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png']:['https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'];
   try{const source=map&&map.getSource(id);if(source&&typeof source.setTiles==='function')source.setTiles(urls);if(map)map.triggerRepaint();say((id==='dem'?'DEM':'卫星')+' 瓦片已缓存，已请求刷新视口');}catch(e){say('瓦片刷新异常：'+((e&&e.stack)||e),true);}
  },
  clearSelectedWaypoint(){
   selectedWaypointId=null;
   if(map&&map.getSource('selected-waypoint'))map.getSource('selected-waypoint').setData(empty);
   if(map&&map.getLayer('waypoint-labels'))map.setFilter('waypoint-labels',null);
  },
  pause(){if(map)map.stop();},
  resume(){if(map){map.resize();map.triggerRepaint();}},
  getCacheStats(){try{return TrailKitBridge.getCacheStats();}catch(_){return '{}';}}
 };
})();
</script>
</body>
