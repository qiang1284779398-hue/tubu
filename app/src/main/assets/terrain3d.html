<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link href="maplibre-gl.css" rel="stylesheet">
<style>
html,body,#map{margin:0;width:100%;height:100%;min-height:100%;background:#e8ece5;overflow:hidden}
#status{position:absolute;left:12px;right:12px;bottom:16px;z-index:10;padding:10px 12px;border-radius:10px;background:rgba(18,32,27,.92);color:#fff;font:13px/1.55 sans-serif;max-width:calc(100% - 48px);box-shadow:0 2px 12px #0003}
#status.error{background:rgba(130,35,28,.95)}
.maplibregl-ctrl-group{border-radius:12px!important;overflow:hidden}
</style></head><body>
<div id="map"></div><div id="status">正在启动三维地图引擎…</div>
<script>
(function(){
 const status=document.getElementById('status');
 function message(t,e){status.textContent=t;status.className=e?'error':'';}
 window.onerror=function(msg,src,line){message('三维页面脚本错误：'+msg+'（第'+line+'行）',true);};
 if(typeof maplibregl==='undefined'){message('地图引擎文件没有成功加载。请检查安装包资源。',true);return;}
 try{
  if(!maplibregl.supported({failIfMajorPerformanceCaveat:false})){
   message('当前手机的系统 WebView 未能启用 WebGL，三维地图无法启动。请更新 Android System WebView / Chrome 后重试。',true);return;
  }
  message('地图引擎已启动，正在请求卫星影像和高程数据…');
  const map=new maplibregl.Map({
   container:'map',center:[98.88,28.45],zoom:11.2,pitch:58,bearing:-18,maxPitch:85,
   style:{version:8,sources:{
    imagery:{type:'raster',tiles:['https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],tileSize:256,maxzoom:19,attribution:'Esri, Vantor, Earthstar Geographics, and the GIS User Community'},
    dem:{type:'raster-dem',tiles:['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],tileSize:256,maxzoom:15,encoding:'terrarium',attribution:'Terrain data: AWS Terrain Tiles / Mapzen'}
   },layers:[{id:'satellite',type:'raster',source:'imagery'}]},
   hash:false,attributionControl:true,failIfMajorPerformanceCaveat:false
  });
  map.addControl(new maplibregl.NavigationControl({visualizePitch:true}),'top-right');
  map.addControl(new maplibregl.ScaleControl({unit:'metric'}),'bottom-right');
  map.on('load',function(){
   try{map.setTerrain({source:'dem',exaggeration:1.12});}catch(e){message('卫星地图已加载，但三维高程初始化失败：'+e.message,true);}
   map.addSource('trail-route',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
   map.addLayer({id:'trail-route-casing',type:'line',source:'trail-route',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#10251e','line-width':7,'line-opacity':.9}});
   map.addLayer({id:'trail-route-line',type:'line',source:'trail-route',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#ffb547','line-width':4}});
   message('地图已启动。若底图空白，请检查网络。双指倾斜 / 双指旋转 / 捏合缩放');
  });
  map.on('error',function(e){const err=e&&e.error?e.error.message:'未知资源错误';message('地图资源请求失败：'+err+'。请确认网络可访问 Esri 与高程服务。',true);});
  map.on('webglcontextlost',function(){message('手机图形渲染上下文丢失，请关闭页面后重新进入。',true);});
  window.setTrailRoute=function(feature){
   if(!map.getSource('trail-route')){window.pendingTrailRoute=feature;return;}
   map.getSource('trail-route').setData({type:'FeatureCollection',features:[feature]});
   const coords=feature.geometry.coordinates;
   if(coords&&coords.length>1){const bounds=coords.reduce((b,p)=>b.extend(p),new maplibregl.LngLatBounds(coords[0],coords[0]));map.fitBounds(bounds,{padding:48,maxZoom:14,duration:900);}
  };
  map.once('load',function(){if(window.pendingTrailRoute)window.setTrailRoute(window.pendingTrailRoute);});
 }catch(e){message('三维地图初始化失败：'+(e&&e.message?e.message:String(e)),true);}
})();
</script>
<script src="maplibre-gl.js" onerror="document.getElementById('status').textContent='MapLibre 地图引擎文件加载失败。'"></script>
</body></html>
